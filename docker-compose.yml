services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buy_my_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - buy_my_saas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d buy_my_saas']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  buy_my_saas_postgres:
